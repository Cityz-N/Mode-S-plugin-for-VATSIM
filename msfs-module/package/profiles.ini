hdg = (L:B_FCU_HEADING_DASHED) if{ -1 } els{ (L:N_FCU_HEADING) }
trk = (L:B_FCU_TRACK_FPA_MODE)
speed = (L:B_FCU_SPEED_DASHED) if{ -1 } els{ (L:N_FCU_SPEED) (L:B_FCU_SPEED_MACH) if{ d 5 > if{ 100 / } } }
vs = (L:N_FCU_VS)
vs_mode = (L:B_FCU_VERTICALSPEED_DASHED) 0 == (L:B_FCU_TRACK_FPA_MODE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2024
verified = yes

; Checked by snapshot + module probe on the 757-200: ALT, HDG, SPD (window digits), V/S and
; blank flags, altimeter. Mach not checkable on the ground.
[Bluebird 757]
match = bluebirdsim-aircraft-757|bluebird 757|bbs757|bbs 757
alt = (L:BBS_AP_TARGET_ALTITUDE)
hdg = (L:BBS_AP_TARGET_HEADING)
speed = (L:BBS_IAS_BLANKED) if{ -1 } els{ (L:B757_MCP_Gau_SPD_AUTO_100, number) 10 / int 100 * (L:B757_MCP_Gau_SPD_AUTO_10, number) 10 / int 1 - 0 max 9 min 10 * + (L:B757_MCP_Gau_SPD_AUTO_1, number) 10 / int 1 - 0 max 9 min + (L:BBS_AIRSPEED_IN_MACH) if{ 100 / } }
vs = (L:BBS_AP_TARGET_VS)
vs_mode = (L:BBS_VS_BLANKED) 0 ==
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2020, MSFS 2024
verified = yes

; TFDi MD-11. Checked by snapshot + module probe on the MD-11F: ALT, HDG, SPD, altimeter.
