; EHS Link aircraft profiles
;
; Each [section] is one aircraft (or family). The first section whose "match" text appears in
; the aircraft title or aircraft.cfg path (case-insensitive, | separates alternatives) is used.
; The section without a "match" line is the fallback for every other aircraft.
;
; Values are MSFS calculator (RPN) expressions: A:vars, L:vars, arithmetic.
;   alt        selected altitude, feet               (negative = not shown)
;   hdg        selected heading/track, degrees       (negative = dashed / managed)
;   trk        non-zero when the window shows TRK
;   speed      selected speed: < 5 is Mach, otherwise knots (negative/0 = dashed)
;     or: ias + mach + mach_mode (non-zero when the window shows Mach)
;   vs         selected V/S, ft/min
;   vs_mode    non-zero when V/S mode is active (otherwise V/S isn't sent)
;   baro       altimeter setting, hPa
;   baro_std   non-zero when STD is selected
;   baro_hpa   non-zero when the pilot's altimeter shows hPa, zero for inHg (omit if unknown)
;   verified   yes once the profile has been checked against the real cockpit
;   sims       simulators it was verified in, e.g. "MSFS 2020" or "MSFS 2020, MSFS 2024"
;              (shown on the website; the module ignores it)
;   source     pmdg777 / pmdg737: MCP values come from PMDG's SDK data instead
;
; Add an aircraft: copy a section, change "match" and the expressions, and share it on GitHub.
;
; Profiles may only READ the aircraft: any expression that writes ("(>L:...", "(>K:..." etc.)
; makes the whole file invalid.

; Automatic updates: at every sim start the module downloads the file at "url" and uses it if
; its "version" is higher than the one it has (cached in the module's work folder, so it also
; works offline). Bump "version" in the repository whenever profiles change.
; The url is only read from the copy shipped in the package, never from a downloaded one.
[Update]
version = 38
url = https://raw.githubusercontent.com/Cityz-N/Mode-S-plugin-for-VATSIM/main/msfs-module/package/profiles.ini

; PMDG 777 (all variants, including custom builds). Reads the MCP through the ngx_ L:vars the
; aircraft publishes itself, so no "EnableDataBroadcast" options-file edit is needed (checked by
; snapshot on a 777-300ERSF with broadcast off: SPD, HDG, ALT, V/S, V/S light, TRK; MSFS 2024: 777-300ER).
; ngx_HDGmode: 0 HDG, non-zero TRK. ngx_VSmode: 0 V/S, non-zero FPA. ngx_SPDmode non-zero =
; Mach (not checkable on the ground: both 0.84 and 84 forms are handled).
[PMDG 777]
match = pmdg-aircraft-77|pmdg 777|pmdg 77
alt = (L:ngx_ALTwindow)
hdg = (L:ngx_HDGwindow)
trk = (L:ngx_HDGmode) 0 !=
speed = (L:ngx_SPDwindow) (L:ngx_SPDmode) 0 != if{ d 5 > if{ 100 / } }
vs = (L:ngx_VSwindow)
vs_mode = (L:ngx_MCP_VS) (L:ngx_VSmode) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2020, MSFS 2024
verified = yes

; PMDG 737 (NG3 / all variants): same ngx_ MCP variables as the 777 (checked by snapshot on a
; 737-800 with broadcast off: SPD, HDG, ALT, V/S and V/S light). Mach not checkable on the ground.
[PMDG 737]
match = pmdg-aircraft-73|pmdg 737|pmdg 73
alt = (L:ngx_ALTwindow)
hdg = (L:ngx_HDGwindow)
speed = (L:ngx_SPDwindow) (L:ngx_SPDmode) 0 != if{ d 5 > if{ 100 / } }
vs = (L:ngx_VSwindow)
vs_mode = (L:ngx_MCP_VS)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2020
verified = yes

; Microsoft/Asobo ATR 42-600 / 72-600. Checked live on the 72-600: ALT, HDG, IAS, V/S and its
; mode, altimeter + STD. (The standard ALT/HDG variables hold unrelated values in this aircraft.)
; No baro_hpa: the ATR PFD shows hPa and inHg together, so controllers see their own preferred unit.
[ATR 42/72-600]
match = atr 72|atr 42|atr72|atr42|microsoft-aircraft-atr
alt = (L:MSATR_FGCP_SELALT)
hdg = (L:MSATR_SEL_HDG)
ias = (A:AUTOPILOT AIRSPEED HOLD VAR, knots)
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (L:MSATR_FGCP_STAT_VS)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:MSATR_BARO_STD_1_STATE)
sims = MSFS 2020, MSFS 2024
verified = yes

; FlyByWire A380X. Same FCU variables as the A32NX (checked live by snapshot: ALT :3, HDG,
; SPD, V/S and the dash/TRK flags present); altimeter uses the XMLVAR hPa selector and the
; standard STD flag (checked live: hPa -> inHg, QNH -> STD).
[A380X (FlyByWire)]
match = flybywire-aircraft-a380|flybywire_a380|a380x
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (L:A32NX_FCU_HDG_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_HEADING_SELECTED) }
trk = (L:A32NX_TRK_FPA_MODE_ACTIVE)
speed = (L:A32NX_FCU_SPD_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_SPEED_SELECTED) }
vs = (L:A32NX_AUTOPILOT_VS_SELECTED)
vs_mode = (L:A32NX_FCU_VS_MANAGED) 0 == (L:A32NX_TRK_FPA_MODE_ACTIVE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (A:KOHLSMAN SETTING STD:1, bool)
baro_hpa = (L:XMLVAR_Baro_Selector_HPA_1)
sims = MSFS 2020, MSFS 2024
verified = yes

; FlyByWire A32NX. Checked live: ALT (index :3; :0 is the managed target), HDG/TRK, SPD and
; Mach (SPEED_SELECTED holds Mach when < 1), V/S (not sent in FPA mode or when dashed),
; hPa/inHg and STD, and managed (dashed) HDG/SPD/V/S via FBW's own dash flags.
[A32NX (FlyByWire)]
match = a320neo flybywire|flybywire a320neo|flybywire-aircraft-a320-neo|a32nx
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (L:A32NX_FCU_HDG_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_HEADING_SELECTED) }
trk = (L:A32NX_TRK_FPA_MODE_ACTIVE)
speed = (L:A32NX_FCU_SPD_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_SPEED_SELECTED) }
vs = (L:A32NX_AUTOPILOT_VS_SELECTED)
vs_mode = (L:A32NX_FCU_VS_MANAGED) 0 == (L:A32NX_TRK_FPA_MODE_ACTIVE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:A32NX_FCU_EFIS_L_DISPLAY_BARO_VALUE_MODE) 0 ==
baro_hpa = (L:A32NX_FCU_EFIS_L_BARO_IS_INHG) !
sims = MSFS 2020, MSFS 2024
verified = yes

; Headwind A330-900neo. Built on FlyByWire code: identical FCU and EFIS variables to the A32NX
; (checked by snapshot against the FCU: ALT :3, HDG, SPD, V/S, QNH, plus the same dash, TRK,
; inHg and baro-mode flags).
[A339 (Headwind)]
match = headwindsim-aircraft-a330|a330-900neo headwind|headwind_a330neo
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (L:A32NX_FCU_HDG_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_HEADING_SELECTED) }
trk = (L:A32NX_TRK_FPA_MODE_ACTIVE)
speed = (L:A32NX_FCU_SPD_MANAGED_DASHES) if{ -1 } els{ (L:A32NX_AUTOPILOT_SPEED_SELECTED) }
vs = (L:A32NX_AUTOPILOT_VS_SELECTED)
vs_mode = (L:A32NX_FCU_VS_MANAGED) 0 == (L:A32NX_TRK_FPA_MODE_ACTIVE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:A32NX_FCU_EFIS_L_DISPLAY_BARO_VALUE_MODE) 0 ==
baro_hpa = (L:A32NX_FCU_EFIS_L_BARO_IS_INHG) !
sims = MSFS 2020, MSFS 2024
verified = yes

; Aerosoft A340-600 Pro (TLS systems). Checked by snapshot against the FCU: ALT/HDG/SPD/V/S
; window values, Mach (SPD window holds 0.xx), STD (TLS baro value reads 0; the standard STD
; flag stays off). No hPa/inHg flag found: controllers see their preferred unit.
[A346 (Aerosoft)]
match = aerosoft-aircraft-a346|aerosoft a346|airbus-a346-pro
alt = (L:TLS_FCU_ALT_WINDOW_VALUE)
hdg = (L:TLS_FCU_HDG_MANAGED) if{ -1 } els{ (L:TLS_FCU_HDG_WINDOW_VALUE) }
trk = (L:TLS_FCU_TRK_FPA_MODE)
speed = (L:TLS_FCU_SPD_MANAGED) if{ -1 } els{ (L:TLS_FCU_SPD_WINDOW_VALUE) }
vs = (L:TLS_FCU_VS_WINDOW_VALUE)
vs_mode = (L:TLS_FCU_VS_MANAGED) 0 == (L:TLS_FCU_TRK_FPA_MODE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:TLS_EFIS_BARO_VALUE_CAPT) 0 ==
sims = MSFS 2020
verified = yes

; iniBuilds A350-900/-1000. Checked by snapshot: ALT (:3), HDG, SPD and Mach (INI_AIRSPEED_DIAL
; holds 0.xx in Mach; the standard Mach flags stay off), V/S (INI_VVI_DIAL), hPa/inHg selector,
; altimeter (reads 1013.2 in STD), and managed modes: INI_FCU_HDG/SPD/VS_DASHED go to 1 while
; the standard variables hold the managed targets, so dashed windows are sent as "---".
[A350 (iniBuilds)]
match = inibuilds-aircraft-a350|inibuilds a350|a350-900|a350-1000
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (L:INI_FCU_HDG_DASHED) if{ -1 } els{ (A:AUTOPILOT HEADING LOCK DIR, degrees) }
speed = (L:INI_FCU_SPD_DASHED) if{ -1 } els{ (L:INI_AIRSPEED_DIAL) }
vs = (L:INI_VVI_DIAL)
vs_mode = (L:INI_FCU_VS_DASHED) 0 == (L:INI_VVI_DIAL) 0 != and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_hpa = (L:XMLVAR_Baro_Selector_HPA_1)
sims = MSFS 2020, MSFS 2024
verified = yes

; FlightFX / Microsoft Citation X (C750). Uses the standard autopilot variables (checked by
; snapshot + module probe: ALT, HDG, SPD, V/S, altimeter). Mach not checked on the ground.
[Citation X (FlightFX)]
match = msfsffx-c750|c750|citation x
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:1, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR, degrees)
ias = (A:AUTOPILOT AIRSPEED HOLD VAR, knots)
mach = (A:AUTOPILOT MACH HOLD VAR, number)
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool) (A:AUTOPILOT MACH HOLD, bool) ||
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (A:KOHLSMAN SETTING STD:1, bool)
sims = MSFS 2020, MSFS 2024
verified = yes

; Microsoft/Asobo A320neo (default). Checked live: ALT, HDG, SPD, V/S, QNH, plus managed
; (dashed) HDG/SPD, hPa/inHg selector and STD. In managed mode the standard variables still
; hold the managed target, so the "show selected" flags turn those into "---" like the FCU.
; Altitude is index :3 (the FCU window); index :0 holds the managed target (e.g. a SID
; constraint) during managed climb/descent. V/S is only sent in V/S mode (dashed otherwise).
; Not yet checked: Mach.
[A320neo (Asobo)]
match = a320 neo asobo|asobo-aircraft-a320-neo
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (L:A320_FCU_SHOW_SELECTED_HEADING) if{ (A:AUTOPILOT HEADING LOCK DIR, degrees) } els{ -1 }
ias = (L:A320_FCU_SHOW_SELECTED_SPEED) if{ (A:AUTOPILOT AIRSPEED HOLD VAR, knots) } els{ -1 }
mach = (L:A320_FCU_SHOW_SELECTED_SPEED) if{ (A:AUTOPILOT MACH HOLD VAR, number) } els{ -1 }
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool)
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:XMLVAR_Baro1_Mode) 2 ==
baro_hpa = (L:XMLVAR_Baro_Selector_HPA_1)
sims = MSFS 2020
verified = yes

; iniBuilds A320neo V2, A321neo, A330-200 and Beluga XL (the defaults in MSFS 2024; same FCU
; variables). Verified live in MSFS 2024 (Beluga XL 2026-11-20: ALT, HDG, SPD, V/S, QNH).
[A320neo V2 / A321neo / A330 / Beluga XL (iniBuilds, MSFS 2024 defaults)]
match = a320neo v2|microsoft-aircraft-a321|microsoft-aircraft-a330|microsoft-belugaxl|a330-belugaxl
alt = (L:INI_ALTITUDE_DIAL)
hdg = (L:INI_FCU_HDG_DASHED) if{ -1 } els{ (L:INI_TRACK_FPA_STATE) if{ (L:INI_TRK_DIAL) } els{ (L:INI_HEADING_DIAL) } }
trk = (L:INI_TRACK_FPA_STATE)
speed = (L:INI_FCU_SPD_DASHED) if{ -1 } els{ (L:INI_AIRSPEED_DIAL) }
vs = (L:INI_VVI_DIAL)
vs_mode = (L:INI_FCU_VS_DASHED) 0 == (L:INI_TRACK_FPA_STATE) 0 == and
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_hpa = (L:XMLVAR_BARO_SELECTOR_HPA_1)
sims = MSFS 2024
verified = yes

; Boeing 737 MAX (Asobo, default in MSFS 2024). Verified live in MSFS 2024: ALT, HDG, SPD, V/S, altimeter.
; Selected altitude is only in index :3 (the standard fallback's :1 would be wrong).
; Mach: the avionics never expose IAS/MACH mode (checked in flight, IAS vs Mach snapshots and LVL CHG:
; every Mach flag stays 0). In Mach the sim only gets the IAS equivalent, so controllers see knots.
[Boeing 737 MAX (Asobo)]
match = asobo-aircraft-b737max|asobo_b737max
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR, degrees)
ias = (A:AUTOPILOT AIRSPEED HOLD VAR, knots)
mach = (A:AUTOPILOT MACH HOLD VAR, number)
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool)
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2024
verified = yes

