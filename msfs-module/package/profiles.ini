; database (hubhop.mobiflight.com) and from WinWing/MobiFlight FCU profiles shared on
; flightsim.to (variable names only). Not yet checked against the cockpit: EuroScope marks their
; data as unverified. Flying one of these? Send a snapshot + panel screenshot (see README) so
; it can be verified. Match strings are best guesses at the aircraft titles/package names.
; ==========================================================================================

; Fenix A32x. Verified from a community snapshot (GitHub issue #1, A320 CFM, MSFS 2024): ALT, HDG, SPD, V/S, flags, QNH.
[Fenix A319/A320/A321]
