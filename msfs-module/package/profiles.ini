; Cessna Citation Longitude (Asobo/Working Title): selected altitude is index :1, so the
; standard fallback would read the wrong value. Speed window dashed unless set manually.
; Verified in MSFS 2024 (2026-11-20): ALT, HDG, SPD, V/S and QNH match the panel.
[Citation Longitude]
match = longitude
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:1, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR, degrees)
ias = (L:XMLVAR_SpeedIsManuallySet) if{ (A:AUTOPILOT AIRSPEED HOLD VAR, knots) } els{ -1 }
mach = (L:XMLVAR_SpeedIsManuallySet) if{ (A:AUTOPILOT MACH HOLD VAR, number) } els{ -1 }
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool)
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (L:XMLVAR_Baro1_ForcedToSTD)
sims = MSFS 2024
verified = yes

; FlightSim Studio E-Jets. Checked live in MSFS 2024 on the E190 (package fss-aircraft-e19x, which also holds the E195):
; ALT, HDG, SPD, altimeter. V/S only counts while the V/S mode light is on (the wheel keeps its last value); V/S itself not yet seen engaged.
[FSS E-Jets]
match = fss-aircraft-e1|flightsim studio e1|fss e1|e170|e175|e190|e195|e-jet|ejet
alt = (L:FSS_EXX_FGC_ROT_VAL_ALT)
hdg = (L:FSS_EXX_FGC_ROT_VAL_HDG)
speed = (L:FSS_EXX_FGC_ROT_VAL_SPD)
vs = (L:FSS_EXX_FGC_ROT_VAL_VS)
vs_mode = (L:FSS_EXX_FGC_LT_VS)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2024
verified = yes

; HorizonSim 787-9, Asobo 787-10 and Kuro 787-8. Checked by snapshot on all three: ALT (:3),
; HDG (index :0/:1 - NOT :2 as one shared panel profile suggested), SPD (manually set), V/S +
; mode, altimeter. MSFS 2024: checked on the 2024 Asobo 787-10 (same variables).
[Boeing 787 (HorizonSim / Asobo / Kuro)]
match = horizonsim-aircraft-787|horizonsim 787|787-9 (ge) horizonsim|horizonsim_b787|787-10 asobo|asobo-aircraft-b787-10|asobo_b787_10|kuro_b787|kuro 787|kuro b787
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:3, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR:1, degrees)
ias = (L:XMLVAR_SpeedIsManuallySet) if{ (A:AUTOPILOT AIRSPEED HOLD VAR, knots) } els{ -1 }
mach = (L:XMLVAR_SpeedIsManuallySet) if{ (A:AUTOPILOT MACH HOLD VAR, number) } els{ -1 }
mach_mode = (L:XMLVAR_AirSpeedIsInMach) (A:AUTOPILOT MANAGED SPEED IN MACH, bool) or
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2020, MSFS 2024
verified = yes

