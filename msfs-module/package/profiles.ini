alt = (L:MD11_AFS_ALT)
hdg = (L:MD11_AFS_HDG)
speed = (L:MD11_AFS_SPD)
vs = (L:MD11_AFS_VS)
vs_mode = (L:MD11_AFS_VS) -9000 >
baro = (A:KOHLSMAN SETTING MB:1, millibars)
sims = MSFS 2020
verified = yes

