; Cirrus Vision Jet SF50 (Microsoft, default in MSFS 2024). Standard variables; verified live in
; MSFS 2024 (2026-11-20): ALT, HDG, SPD, V/S, altimeter.
[Vision Jet (Microsoft)]
match = microsoft-aircraft-sf50|microsoft_sf50|vision jet
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:1, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR, degrees)
ias = (A:AUTOPILOT AIRSPEED HOLD VAR, knots)
mach = (A:AUTOPILOT MACH HOLD VAR, number)
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool) (A:AUTOPILOT MACH HOLD, bool) ||
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (A:KOHLSMAN SETTING STD:1, bool)
sims = MSFS 2024
verified = yes

; Fallback: the simulator's standard autopilot variables (default aircraft and many others).
; Altitude is index :1, the selected-altitude slot used by default/Working Title avionics
; (confirmed by generic Asobo-aircraft panel profiles, the Longitude, CJ4 and TBM 930); index
; :0 can hold unrelated or managed values.
[Standard]
alt = (A:AUTOPILOT ALTITUDE LOCK VAR:1, feet)
hdg = (A:AUTOPILOT HEADING LOCK DIR, degrees)
ias = (A:AUTOPILOT AIRSPEED HOLD VAR, knots)
mach = (A:AUTOPILOT MACH HOLD VAR, number)
mach_mode = (A:AUTOPILOT MANAGED SPEED IN MACH, bool) (A:AUTOPILOT MACH HOLD, bool) ||
vs = (A:AUTOPILOT VERTICAL HOLD VAR, feet/minute)
vs_mode = (A:AUTOPILOT VERTICAL HOLD, bool)
baro = (A:KOHLSMAN SETTING MB:1, millibars)
baro_std = (A:KOHLSMAN SETTING STD:1, bool)
verified = no
